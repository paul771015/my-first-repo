name: Manual Test Run
on:
  workflow_dispatch: 
jobs:
  run-tests: 
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 
        uses: actions/setup-node@v4 
        with: 
          node-version: 24.21.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers 
        run: npx playwright install --with-deps
      - name: Run API tests 
        run: npm run tests:api -- --reporter=html  
        env: 
          PLAYWRIGHT_HTML_REPORT: playwright-report-api 
      - name: Run UI tests  
        run: npm run tests:ui -- --reporter=html  
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-ui
      - name: Upload API test report  
        if: ${{ !cancelled() }}  
        uses: actions/upload-artifact@v4  
        with:  
          name: playwright-report-api  
          path: playwright-report-api/
          retention-days: 7 
      - name: Upload UI test report  
        if: ${{ !cancelled() }}  
        uses: actions/upload-artifact@v4  
        with:  
          name: playwright-report-ui  
          path: playwright-report-ui/
          retention-days: 7 